<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tachyon — Accesso Riservato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --rainbow: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
      --green-glow: #4ade80;
      --deep-bg: #050f08;
      --glass: rgba(0, 0, 0, 0.7);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #003366;
      font-family: 'Outfit', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .secret-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('https://i.imgur.com/Bmm2ERx.gif') repeat;
      background-size: 200px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 800px;
      padding: 40px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 4px solid #fff;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
      animation: rainbow-border 2s linear infinite, contentAppear 0.5s ease-out;
    }

    @keyframes rainbow-border {
      0% {
        border-color: #ff0000;
      }

      14% {
        border-color: #ff7f00;
      }

      28% {
        border-color: #ffff00;
      }

      42% {
        border-color: #00ff00;
      }

      56% {
        border-color: #0000ff;
      }

      70% {
        border-color: #4b0082;
      }

      84% {
        border-color: #8b00ff;
      }

      100% {
        border-color: #ff0000;
      }
    }

    @keyframes contentAppear {
      from {
        transform: scale(0);
        rotate: 360deg;
      }

      to {
        transform: scale(1);
        rotate: 0deg;
      }
    }

    .badge-secret {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: var(--rainbow);
      border-radius: 100px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #000;
      text-shadow: 1px 1px #fff;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 56px;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 3px 3px 0px #ff00ff, -3px -3px 0px #00ffff;
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% {
        transform: translate(1px, 1px) rotate(0deg);
      }

      10% {
        transform: translate(-1px, -2px) rotate(-1deg);
      }

      20% {
        transform: translate(-3px, 0px) rotate(1deg);
      }

      30% {
        transform: translate(3px, 2px) rotate(0deg);
      }

      40% {
        transform: translate(1px, -1px) rotate(1deg);
      }

      50% {
        transform: translate(-1px, 2px) rotate(-1deg);
      }

      60% {
        transform: translate(-3px, 1px) rotate(0deg);
      }

      70% {
        transform: translate(3px, 1px) rotate(-1deg);
      }

      80% {
        transform: translate(-1px, -1px) rotate(1deg);
      }

      90% {
        transform: translate(1px, 2px) rotate(0deg);
      }

      100% {
        transform: translate(1px, -2px) rotate(-1deg);
      }
    }

    .video-slot {
      margin: 20px 0;
      padding: 20px;
      border: 2px dashed #fff;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
    }

    #video-preview {
      width: 100%;
      max-height: 300px;
      display: block;
      border-radius: 10px;
      margin-top: 15px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 100px;
      font-weight: 800;
      border: 2px solid #fff;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: #fff;
      color: #000;
      transform: scale(1.2) rotate(5deg);
    }
  </style>
</head>

<body>
  <div class="secret-container">
    <div class="overlay"></div>

    <div class="content">
      <div class="badge-secret">
        ⚠️ NYAN CORE ACTIVATED ⚠️
      </div>

      <h1>MEME PROTOCOL</h1>
      <p style="color: #fff; font-weight: bold;">Hai sbloccato la potenza suprema di Tachyon. Il video segreto è ora in
        esecuzione sulla rete mesh!</p>

      <div class="video-slot">
        <video id="video-preview" src="assets/verysecretvideo.mp4" controls autoplay loop></video>
      </div>

      <div style="margin-bottom: 20px;">
        <a href="index.html" class="back-btn">EXIT TO REALITY ←</a>
      </div>

      <div style="font-family: 'DM Mono'; font-size: 10px; opacity: 0.7;">
        Protocollo v6.9.420 - Memes are the backbone of the internet
      </div>
    </div>
  </div>

  <script>
    const videoPreview = document.getElementById('video-preview');

    // Effetto distorsione mouse meme
    document.addEventListener('mousemove', (e) => {
      const content = document.querySelector('.content');
      const rotateX = (window.innerHeight / 2 - e.pageY) / 10;
      const rotateY = (e.pageX - window.innerWidth / 2) / 10;
      content.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
  </script>
</body>

</html>
